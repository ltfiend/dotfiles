name: betterleaks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned release binary instead of a third-party action.
      - name: Install betterleaks
        run: |
          curl -fsSLO https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz
          echo "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7  betterleaks_1.9.0_linux_x64.tar.gz" | sha256sum -c
          tar -xzf betterleaks_1.9.0_linux_x64.tar.gz betterleaks
          sudo install -m755 betterleaks /usr/local/bin/betterleaks
      - name: Scan full history
        run: betterleaks git --no-banner --redact .
